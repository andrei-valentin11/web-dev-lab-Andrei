<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — AquaEduGame</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-fish logo-icon"></i>
        <h1>AquaEduGame</h1>
        <p>Join our e-learning platform</p>
      </div>
      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required placeholder="Create a password" minlength="6" />
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" required placeholder="Confirm password" />
        </div>
        <div class="form-group">
          <label for="signup-role">Role</label>
          <select id="signup-role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <button type="submit" class="btn primary full-width">Create Account</button>
      </form>
      <div class="auth-links">
        <p>Already have an account? <a href="login.html">Sign In</a></p>
      </div>
      <div class="demo-notice">
        <small>Demo Mode: Account creation is simulated locally.</small>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
