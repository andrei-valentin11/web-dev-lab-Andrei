<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — AquaEduGame</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-fish logo-icon"></i>
        <h1>AquaEduGame</h1>
        <p>Sign in to your learning dashboard</p>
      </div>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Password" />
        </div>
        <button type="submit" class="btn primary full-width">Sign In</button>
      </form>
      <div class="auth-links">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p><a href="#" id="forgot-password">Forgot Password?</a></p>
      </div>
      <div class="demo-notice">
        <small>Demo Mode: Use any email/password to sign in.</small>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
